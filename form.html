    <meta charset="UTF-8">

        content="This page contains a form that invites people or engineers that want to know more about UnitX products and they can submit a request form">

    <!--Facebook Meta Tags -->
    <meta property="og:title" content="WDD231 Contact an expert of UnitX Web Page | Daniel Osorio |">
    <meta property="og:description" content="This page contains a form that invites people or engineers that want to know more about UnitX products and they can submit a request form">
    <meta property="og:image" content="https://dani-3108.github.io/wdd231/finalproject/images/cpu.svg">
    <meta property="og:url" content="https://dani-3108.github.io/wdd231/finalproject/form.html">
    <!--Favicon reference-->
    <link rel="icon" href="favicon.ico">
    <!--Link to Google fonts API-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <!--Link for CSS and JavaScript-->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/form-small.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script type="module" src="scripts/main.mjs"></script>
    <script type="module" src="scripts/form.mjs"></script>
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/cpu.svg" alt="Site Logo" width="35" height="35">
            <span>UnitX</span>
        </div>
        <button id="hamburger" aria-label="Menu">&#9776;</button>
        <nav class="menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li class="current"><a href="form.html">Contact Us</a></li>
                <li><a href="case-studies.html">Case studies</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1 class="formheader">Talk to an Expert Today</h1>
        <form method="get" action="review.html">
            <fieldset>
                <legend>Your information</legend>
                <label for="yourname">Your Name*<input type="text" name="yourname" id="yourname" required></label>
                <label for="youremail">Company Email Address*<input type="email" name="youremail" id="youremail"
                        required></label>
                <label for="yourphone">Phone Number (Optional)<input type="text" name="yourphone" id="yourphone"></label>
                <label for="yourcompany">Your Company*<input type="text" name="yourcompany" id="yourcompany"
                        required></label>
                <label for="yourtitle">Your Position*<input type="text" name="yourtitle" id="yourtitle" required></label>
            </fieldset>
            <fieldset>
                <legend>Product</legend>
                <label for="productName">Products*
                    <select name="productName" id="productName" required>
                        <option value="" disabled selected> Select a Product ...</option>
                    </select>
                </label>
                <label for="hearfromus">How did you hear about us?* <input type="text" name="hearfromus"
                        id="hearfromus"></label>
                <label for="comments">Comments / additional information <textarea name="comments"
                        id="comments"></textarea></label>
            </fieldset>
            <input class="submitButton" type="submit" value="Requesting to get contacted">
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> 🌿 Daniel Osorio 🌿 Mexico</p>
        <p id="lastModified"></p>
        <p id="visit-message"></p>
        <a href="references.html">References</a>
        <a href="https://www.youtube.com/watch?v=KAbOkGg_KlM">Video Demonstration and Reflection</a>
    </footer>
</body>
</html>
